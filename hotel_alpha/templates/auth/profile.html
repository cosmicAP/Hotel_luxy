{% extends 'base.html' %}
{% block title %}My Profile{% endblock %}

{% block content %}
<div class="main">
    <a href="{% url 'home_allo' %}" class="back-link">&#8592; Back to Home</a>

    <div class="profile-card">
        <div class="avatar">{{ user.username|slice:":1"|upper }}</div>
        <h2 style="text-align:center;font-size:1.5rem;color:var(--primary-dark);margin-bottom:4px;">{{ user.get_full_name|default:user.username }}</h2>
        <p style="text-align:center;color:var(--text-light);margin-bottom:24px;">@{{ user.username }}</p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>First Name</label>
                <input type="text" name="first_name" value="{{ user.first_name }}" placeholder="First name">
            </div>
            <div class="form-group">
                <label>Last Name</label>
                <input type="text" name="last_name" value="{{ user.last_name }}" placeholder="Last name">
            </div>
            <button type="submit" class="btn-submit">Save Changes</button>
        </form>

        <div class="profile-links">
            <a href="{% url 'change_password' %}">&#128273; Change Password</a>
            <a href="{% url 'bookings_dashboard' %}">&#128196; My Bookings</a>
        </div>
    </div>
</div>
{% endblock %}
